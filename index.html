<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HAC Grade Viewer</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 20px;
      background: #f4f4f9;
      margin: 0;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      max-width: 500px;
      margin: 40px auto;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input,
    button {
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      box-sizing: border-box;
      font-size: 14px;
      border-radius: 6px;
    }

    input {
      border: 1px solid #ccc;
      background: white;
    }

    input:focus {
      outline: none;
      border-color: #007bff;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0069d9;
    }

    button:disabled {
      background: #99c2ff;
      cursor: not-allowed;
    }

    .secondary-button {
      background: #eee;
      color: #333;
    }

    .secondary-button:hover {
      background: #ddd;
    }

    .course {
      border-bottom: 1px solid #eee;
      padding: 14px 0;
    }

    .course:last-child {
      border-bottom: none;
    }

    .course-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .course-name {
      font-size: 14px;
    }

    .course-grade {
      font-weight: bold;
      white-space: nowrap;
    }

    .course-updated {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    .grade-high {
      color: #1a7f37;
    }

    .grade-mid {
      color: #b58900;
    }

    .grade-low {
      color: #d1242f;
    }

    .grade-na {
      color: #999;
    }

    .status {
      text-align: center;
      margin: 14px 0;
      color: #555;
      font-size: 14px;
    }

    .success {
      color: #1a7f37;
    }

    .error {
      color: #d1242f;
    }

    .saved-box {
      background: #f0f7ff;
      border: 1px solid #cfe3ff;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .saved-title {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .saved-user {
      font-size: 13px;
      color: #666;
    }

    .hidden {
      display: none;
    }

    .divider {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin: 18px 0;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>HAC Grade Viewer</h2>

    <div class="subtitle">
      View your classes and grades from Home Access Center.
    </div>

    <!-- SAVED SESSION -->
    <div id="savedBox" class="saved-box hidden">
      <div class="saved-title">
        Saved login found
      </div>

      <div id="savedUser" class="saved-user">
        Checking saved session...
      </div>

      <button id="useSavedBtn" onclick="useSavedSession()">
        Use Saved Login
      </button>
    </div>

    <!-- LOGIN -->
    <div id="loginSection">

      <input
        type="text"
        id="user"
        placeholder="HAC Username"
        autocomplete="username"
      >

      <input
        type="password"
        id="pass"
        placeholder="HAC Password"
        autocomplete="current-password"
      >

      <button
        id="loadBtn"
        onclick="fetchGrades()"
      >
        Load Grades
      </button>

    </div>

    <div id="status" class="status"></div>

    <div id="output"></div>

    <button
      id="logoutBtn"
      class="secondary-button hidden"
      onclick="logout()"
    >
      Forget Saved Login
    </button>

  </div>


  <script>

    /*
     * The Vercel/local backend.
     *
     * When testing locally:
     * http://localhost:3000
     *
     * When deployed:
     * change this to your Vercel URL.
     */
    const API_BASE = "http://localhost:3000";


    /*
     * The session ID is NOT the HAC password.
     *
     * It is simply a random ID that points to the
     * saved session inside Redis.
     */
    const SESSION_STORAGE_KEY = "hac_session_id";


    function gradeClass(gradeStr) {

      if (!gradeStr) {
        return "grade-na";
      }

      const num = parseFloat(gradeStr);

      if (isNaN(num)) {
        return "grade-na";
      }

      if (num >= 90) {
        return "grade-high";
      }

      if (num >= 75) {
        return "grade-mid";
      }

      return "grade-low";
    }


    /*
     * Run when the page opens.
     *
     * Check whether this browser has a saved
     * Redis session.
     */
    async function checkSavedSession() {

      const sessionId =
        localStorage.getItem(SESSION_STORAGE_KEY);

      if (!sessionId) {
        return;
      }

      try {

        const res = await fetch(
          `${API_BASE}/api/session`,
          {
            method: "GET",
            headers: {
              "X-Session-ID": sessionId
            }
          }
        );

        const data = await res.json();

        if (
          res.ok &&
          data.authenticated === true
        ) {

          document
            .getElementById("savedBox")
            .classList.remove("hidden");

          document
            .getElementById("savedUser")
            .textContent =
              `Saved account: ${data.username || "HAC account"}`;

          /*
           * We don't automatically load the grades here.
           *
           * The user chooses "Use Saved Login".
           */

        } else {

          /*
           * Session no longer exists.
           * Remove the old ID.
           */
          localStorage.removeItem(
            SESSION_STORAGE_KEY
          );

        }

      } catch (error) {

        console.error(
          "Saved session check failed:",
          error
        );

      }

    }


    /*
     * Use the session already saved in Redis.
     */
    async function useSavedSession() {

      const sessionId =
        localStorage.getItem(SESSION_STORAGE_KEY);

      if (!sessionId) {
        return;
      }

      const status =
        document.getElementById("status");

      const output =
        document.getElementById("output");

      const savedButton =
        document.getElementById("useSavedBtn");

      savedButton.disabled = true;

      status.className = "status";

      status.textContent =
        "Restoring your saved HAC session...";

      output.innerHTML = "";

      try {

        const res = await fetch(
          `${API_BASE}/api/session`,
          {
            method: "GET",
            headers: {
              "X-Session-ID": sessionId
            }
          }
        );

        const data = await res.json();

        if (
          !res.ok ||
          data.authenticated !== true
        ) {

          localStorage.removeItem(
            SESSION_STORAGE_KEY
          );

          document
            .getElementById("savedBox")
            .classList.add("hidden");

          status.className =
            "status error";

          status.textContent =
            "Your saved login has expired. Please log in again.";

          savedButton.disabled = false;

          return;
        }

        status.className =
          "status success";

        status.textContent =
          "Saved login restored successfully!";

        document
          .getElementById("loginSection")
          .classList.add("hidden");

        document
          .getElementById("logoutBtn")
          .classList.remove("hidden");

        renderGrades(
          data.classes || []
        );

      } catch (error) {

        console.error(error);

        status.className =
          "status error";

        status.textContent =
          "Could not connect to the backend server.";

      } finally {

        savedButton.disabled = false;

      }

    }


    /*
     * Log into HAC and save the returned session ID.
     */
    async function fetchGrades() {

      const username =
        document
          .getElementById("user")
          .value
          .trim();

      const password =
        document
          .getElementById("pass")
          .value;

      const output =
        document.getElementById("output");

      const status =
        document.getElementById("status");

      const btn =
        document.getElementById("loadBtn");


      if (!username || !password) {

        status.className =
          "status error";

        status.textContent =
          "Enter your username and password.";

        return;
      }


      btn.disabled = true;

      status.className =
        "status";

      status.textContent =
        "Logging into HAC and fetching grades...";

      output.innerHTML = "";


      try {

        const res = await fetch(
          `${API_BASE}/api/grades`,
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              username,
              password
            })
          }
        );


        const data =
          await res.json();


        if (
          !res.ok ||
          data.error
        ) {

          status.className =
            "status error";

          status.textContent =
            data.error ||
            "Something went wrong.";

          return;
        }


        /*
         * VERY IMPORTANT:
         *
         * Save only the random session ID.
         *
         * The HAC password is NEVER saved here.
         */
        if (data.sessionId) {
  localStorage.setItem("hac_session_id", data.sessionId);

  console.log("Session saved:", data.sessionId);
} else {
  console.error("Server did not return a sessionId!");
}


        status.className =
          "status success";

        status.textContent =
          "HAC login successful. Your session was saved.";


        document
          .getElementById("loginSection")
          .classList.add("hidden");


        document
          .getElementById("savedBox")
          .classList.add("hidden");


        document
          .getElementById("logoutBtn")
          .classList.remove("hidden");


        renderGrades(
          data.classes || []
        );


        /*
         * Clear the password field after login.
         */
        document
          .getElementById("pass")
          .value = "";


      } catch (err) {

        console.error(
          "Grade request failed:",
          err
        );

        status.className =
          "status error";

        status.textContent =
          "Error connecting to the backend server. Is server.js running?";

      } finally {

        btn.disabled = false;

      }

    }


    /*
     * Display classes and grades.
     */
    function renderGrades(classes) {

      const output =
        document.getElementById("output");


      if (
        classes &&
        classes.length > 0
      ) {

        output.innerHTML =
          classes.map(c => `

            <div class="course">

              <div class="course-row">

                <span class="course-name">
                  ${escapeHtml(c.className || "")}
                </span>

                <span
                  class="course-grade ${gradeClass(c.grade)}"
                >
                  ${escapeHtml(c.grade || "N/A")}
                </span>

              </div>

              ${
                c.lastUpdated
                  ? `
                    <div class="course-updated">
                      Updated ${escapeHtml(c.lastUpdated)}
                    </div>
                  `
                  : ""
              }

            </div>

          `).join("");

      } else {

        output.innerHTML =
          '<div class="status">No classes found on this page.</div>';

      }

    }


    /*
     * Basic HTML escaping so grade/class data
     * from HAC cannot become HTML.
     */
    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
     * Delete the Redis session.
     */
    async function logout() {

      const sessionId =
        localStorage.getItem(
          SESSION_STORAGE_KEY
        );


      const status =
        document.getElementById("status");


      if (!sessionId) {

        resetPage();

        return;
      }


      try {

        const res = await fetch(
          `${API_BASE}/api/logout`,
          {
            method: "POST",

            headers: {
              "X-Session-ID": sessionId
            }
          }
        );


        if (!res.ok) {

          status.className =
            "status error";

          status.textContent =
            "Could not forget the saved login.";

          return;
        }


        localStorage.removeItem(
          SESSION_STORAGE_KEY
        );


        resetPage();


      } catch (error) {

        console.error(
          "Logout failed:",
          error
        );

        status.className =
          "status error";

        status.textContent =
          "Could not connect to the backend.";

      }

    }


    /*
     * Return the page to the normal login screen.
     */
    function resetPage() {

      document
        .getElementById("loginSection")
        .classList.remove("hidden");

      document
        .getElementById("savedBox")
        .classList.add("hidden");

      document
        .getElementById("logoutBtn")
        .classList.add("hidden");

      document
        .getElementById("output")
        .innerHTML = "";

      document
        .getElementById("status")
        .className = "status";

      document
        .getElementById("status")
        .textContent =
        "Saved login forgotten.";

      document
        .getElementById("user")
        .value = "";

      document
        .getElementById("pass")
        .value = "";

    }


    /*
     * Check Redis as soon as the page loads.
     */
    checkSavedSession();

  </script>

</body>
</html>
