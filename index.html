<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cookie Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #111;
    }

    .card {
      width: min(90%, 500px);
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      color: #555;
    }

    .result {
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      background: #f0f0f0;
      text-align: left;
      word-break: break-word;
    }

    .label {
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>

</head>

<body>

  <div class="card">

```
<h1>🍪 Cookie Test</h1>

<p>
  This page checks whether your browser can keep
  the same cookie after refreshing.
</p>

<div class="result">

  <div>
    <span class="label">Status:</span>
    <span id="status">Testing...</span>
  </div>

  <br>

  <div>
    <span class="label">Cookie ID:</span>
    <span id="cookieId">Checking...</span>
  </div>

</div>

<button onclick="testCookie()">
  Test Again
</button>
```

  </div>

  <script>

    async function testCookie() {

      const status =
        document.getElementById('status');

      const cookieId =
        document.getElementById('cookieId');


      status.textContent =
        'Testing...';

      cookieId.textContent =
        'Checking...';


      try {

        const response =
          await fetch(
            '/api/cookie-test',
            {
              method: 'GET',

              credentials: 'include',

              cache: 'no-store'
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.error ||
            `HTTP ${response.status}`
          );

        }


        if (data.existing) {

          status.textContent =
            'COOKIE FOUND ✅';

        } else {

          status.textContent =
            'NEW COOKIE CREATED 🍪';

        }


        cookieId.textContent =
          data.cookieId || 'None';


      } catch (error) {

        console.error(error);

        status.textContent =
          'ERROR ❌';

        cookieId.textContent =
          error.message;

      }

    }


    testCookie();

  </script>

</body>
</html>
